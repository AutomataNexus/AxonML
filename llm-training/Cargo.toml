[package]
name = "llm-training"
version = "0.1.0"
edition = "2024"
description = "Train the nine AxonML LLM architectures end-to-end on real text corpora"
rust-version = "1.85"

# Standalone workspace — decouples from /opt/AxonML root workspace so we can
# iterate on training code without rebuilding the entire framework.
[workspace]

[dependencies]
axonml-core      = { path = "/opt/AxonML/crates/axonml-core" }
axonml-tensor    = { path = "/opt/AxonML/crates/axonml-tensor" }
axonml-autograd  = { path = "/opt/AxonML/crates/axonml-autograd" }
axonml-nn        = { path = "/opt/AxonML/crates/axonml-nn" }
axonml-optim     = { path = "/opt/AxonML/crates/axonml-optim" }
axonml-llm       = { path = "/opt/AxonML/crates/axonml-llm" }
axonml-serialize = { path = "/opt/AxonML/crates/axonml-serialize" }
axonml           = { path = "/opt/AxonML/crates/axonml" }

rand = "0.8"
signal-hook = "0.3"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cuda-12060"] }

# Trace-export dependencies (claude_trace_export binary). Kept narrow —
# serde_json for streaming JSONL parse, walkdir for the project tree walk,
# clap for CLI ergonomics, anyhow for flat error bubbling.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[features]
default = []
cuda = [
    "axonml-core/cuda",
    "axonml-tensor/cuda",
    "axonml-autograd/cuda",
    "axonml-nn/cuda",
    "dep:cudarc",
]

# =============================================================================
# Training binaries — one per LLM architecture
# =============================================================================

[[bin]]
name = "train_gpt2"
path = "src/bin/train_gpt2.rs"

[[bin]]
name = "train_llama"
path = "src/bin/train_llama.rs"

[[bin]]
name = "train_mistral"
path = "src/bin/train_mistral.rs"

[[bin]]
name = "train_phi"
path = "src/bin/train_phi.rs"

[[bin]]
name = "train_hydra"
path = "src/bin/train_hydra.rs"

[[bin]]
name = "train_bert"
path = "src/bin/train_bert.rs"

[[bin]]
name = "train_chimera"
path = "src/bin/train_chimera.rs"

[[bin]]
name = "train_ssm"
path = "src/bin/train_ssm.rs"

[[bin]]
name = "train_ctl"
path = "src/bin/train_ctl.rs"

[[bin]]
name = "train_trident_code"
path = "src/bin/train_trident_code.rs"

[[bin]]
name = "profile_train_step"
path = "src/bin/profile_train_step.rs"

[[bin]]
name = "bench_variable_matmul"
path = "src/bin/bench_variable_matmul.rs"

# Claude Code trace → DeepSeek-R1 SFT corpus (for Oracle LoRA fine-tune).
[[bin]]
name = "claude_trace_export"
path = "src/bin/claude_trace_export.rs"

# Recurrent-Depth Transformer trainer (task #58). K-sampled core iterations
# per batch to generalize across test-time iteration counts.
[[bin]]
name = "train_rdt"
path = "src/bin/train_rdt.rs"

# K-scaling perplexity curve for a trained RDT (step 6 of task #58).
[[bin]]
name = "eval_rdt"
path = "src/bin/eval_rdt.rs"
