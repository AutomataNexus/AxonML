[package]
name = "nexus-serve"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust LLM inference server — load HuggingFace models, serve via OpenAI-compatible API. Replaces ollama with native AxonML inference."

[workspace]

[dependencies]
# AxonML framework
axonml-core      = { path = "/opt/AxonML/crates/axonml-core" }
axonml-tensor    = { path = "/opt/AxonML/crates/axonml-tensor" }
axonml-autograd  = { path = "/opt/AxonML/crates/axonml-autograd" }
axonml-nn        = { path = "/opt/AxonML/crates/axonml-nn" }
axonml-llm       = { path = "/opt/AxonML/crates/axonml-llm" }
axonml-serialize = { path = "/opt/AxonML/crates/axonml-serialize" }
axonml-quant     = { path = "/opt/AxonML/crates/axonml-quant" }

# HTTP server
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"

# Parallel dequantization
rayon = "1.10"

# mlock support
libc = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GGUF model loading
byteorder = "1.5"
memmap2 = "0.9"

# Tokenizer
tokenizers = "0.21"

# Misc
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[features]
default = []
cuda = [
    "axonml-core/cuda",
    "axonml-tensor/cuda",
    "axonml-autograd/cuda",
    "axonml-nn/cuda",
    "dep:cudarc",
]
# Hailo-10H NPU backend (Pi-1 testbench / GenAI on-edge target).
# Gated to keep host-side builds free of HailoRT (it's only available on the
# deployed Pi anyway). Enable on the Pi: `cargo build --release --features hailo10h`.
hailo10h = ["dep:parking_lot"]
nexusrt = ["dep:nexus-rt"]

[dependencies.parking_lot]
version = "0.12"
optional = true

[dependencies.nexus-rt]
path = "/opt/NexusRT"
optional = true

[dependencies.cudarc]
version = "0.19"
optional = true
default-features = false
features = ["std", "driver", "cuda-12060"]

[[bin]]
name = "nexus-serve"
path = "src/main.rs"

[[bin]]
name = "gguf_inspect"
path = "src/bin/gguf_inspect.rs"

[[bin]]
name = "spec_bench"
path = "src/bin/spec_bench.rs"

[[bin]]
name = "tokenize_test"
path = "src/bin/tokenize_test.rs"
