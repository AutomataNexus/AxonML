name: Release

# Triggered by pushing a semver tag like `v0.6.2` or via manual dispatch.
# Pre-release tags (e.g. `v0.7.0-rc1`) also run the workflow; the crates.io
# publish job skips pre-releases — only the GitHub release + SLSA artifacts
# are produced for them.
#
# Deliverables:
#   * Cross-platform axonml-cli + axonml-server binaries
#     (linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64)
#   * SHA256 checksum per archive
#   * SLSA v1.0 provenance (intoto attestation) covering every artifact
#   * GitHub release with auto-generated notes + all of the above attached

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (must already exist, e.g. v0.6.2)'
        required: true

permissions: read-all

jobs:
  # ---------------------------------------------------------------------------
  # Per-platform binary build. Matrix builds run in parallel; results flow into
  # the `collect` job which hashes everything so SLSA can sign one manifest.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build axonml-cli
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --package axonml-cli --target ${{ matrix.target }}
          else
            cargo build --release --package axonml-cli --target ${{ matrix.target }}
          fi

      - name: Build axonml-server
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --package axonml-server --target ${{ matrix.target }}
          else
            cargo build --release --package axonml-server --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="${{ matrix.name }}"
          OUT=dist
          mkdir -p "$OUT"

          if [ "$NAME" = "windows-x86_64" ]; then
            CLI_BIN="target/${{ matrix.target }}/release/axonml.exe"
            SERVER_BIN="target/${{ matrix.target }}/release/axonml-server.exe"
            CLI_ARCHIVE="axonml-cli-${VERSION}-${NAME}.zip"
            SERVER_ARCHIVE="axonml-server-${VERSION}-${NAME}.zip"
            (cd target/${{ matrix.target }}/release && 7z a -tzip "../../../$OUT/$CLI_ARCHIVE" axonml.exe)
            (cd target/${{ matrix.target }}/release && 7z a -tzip "../../../$OUT/$SERVER_ARCHIVE" axonml-server.exe)
          else
            CLI_ARCHIVE="axonml-cli-${VERSION}-${NAME}.tar.gz"
            SERVER_ARCHIVE="axonml-server-${VERSION}-${NAME}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "$OUT/$CLI_ARCHIVE" axonml
            tar -C "target/${{ matrix.target }}/release" -czf "$OUT/$SERVER_ARCHIVE" axonml-server
          fi

          # Per-archive sha256 (for transparency outside SLSA)
          (cd "$OUT" && for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256" 2>/dev/null || shasum -a 256 "$f" > "$f.sha256"
          done)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect everything into a single artifact and compute the base64 manifest
  # that the SLSA generator signs. This MUST be one job with all archives in
  # one directory so the provenance covers the full release at once.
  # ---------------------------------------------------------------------------
  collect:
    name: Collect hashes
    needs: build-binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Compute hash manifest
        id: hash
        run: |
          cd dist
          HASHES=$(sha256sum *.tar.gz *.zip 2>/dev/null | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SLSA v1.0 provenance. slsa-framework/slsa-github-generator does the signing
  # inside a GitHub-provided OIDC identity, so this workflow never sees a key.
  # `upload-assets: true` attaches the `.intoto.jsonl` to the GitHub Release
  # created by the final step.
  # ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: collect
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.collect.outputs.hashes }}
      upload-assets: true

  # ---------------------------------------------------------------------------
  # Source tarball (clean `git archive`, no build artifacts) + final GitHub
  # release assembly. Runs after provenance so the release already has the
  # SLSA attestation attached when this step uploads the binaries + source.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [collect, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build source tarball
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          SRC="axonml-${VERSION}-source"
          git archive --format=tar.gz --prefix="axonml-${VERSION}/" HEAD > "dist/${SRC}.tar.gz"
          (cd dist && sha256sum "${SRC}.tar.gz" > "${SRC}.tar.gz.sha256")

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AxonML ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.tag, '-') }}
          files: dist/*
