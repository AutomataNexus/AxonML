name: Release

# SLSA Build Level 3 release pipeline.
#
# L3 requirements satisfied:
#   1. All actions pinned by full SHA — tags can be moved, SHAs cannot
#   2. persist-credentials: false on every checkout — no token leakage
#   3. Minimal per-job permissions (principle of least privilege)
#   4. Builds on GitHub-hosted ephemeral runners (isolated, non-reusable)
#   5. Provenance via slsa-github-generator reusable workflow (OIDC-signed,
#      non-falsifiable, generated outside caller-controlled code)
#   6. GitHub native attestation via actions/attest-build-provenance
#   7. No third-party release actions — uses gh CLI directly
#   8. Source tarball via git archive (deterministic, no build artifacts)
#
# Deliverables:
#   * Cross-platform axonml-cli + axonml-server binaries
#     (linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64)
#   * SHA256 checksum per archive
#   * SLSA v1.0 provenance (.intoto.jsonl) — verifiable with slsa-verifier
#   * GitHub artifact attestation — verifiable with gh attestation verify
#   * Source tarball (git archive, reproducible)
#
# Verification:
#   slsa-verifier verify-artifact <artifact> \
#     --provenance-path <intoto.jsonl> \
#     --source-uri github.com/AutomataNexus/AxonML
#
#   gh attestation verify <artifact> -o AutomataNexus

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (must already exist, e.g. v0.6.2)'
        required: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Per-platform binary build. Matrix builds run in parallel; results flow into
  # the `collect` job which hashes everything so SLSA can sign one manifest.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2025-05-21
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build axonml-cli
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --package axonml-cli --target ${{ matrix.target }}
          else
            cargo build --release --package axonml-cli --target ${{ matrix.target }}
          fi

      - name: Build axonml-server
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --package axonml-server --target ${{ matrix.target }}
          else
            cargo build --release --package axonml-server --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="${{ matrix.name }}"
          OUT=dist
          mkdir -p "$OUT"

          if [ "$NAME" = "windows-x86_64" ]; then
            CLI_ARCHIVE="axonml-cli-${VERSION}-${NAME}.zip"
            SERVER_ARCHIVE="axonml-server-${VERSION}-${NAME}.zip"
            (cd target/${{ matrix.target }}/release && 7z a -tzip "../../../$OUT/$CLI_ARCHIVE" axonml.exe)
            (cd target/${{ matrix.target }}/release && 7z a -tzip "../../../$OUT/$SERVER_ARCHIVE" axonml-server.exe)
          else
            CLI_ARCHIVE="axonml-cli-${VERSION}-${NAME}.tar.gz"
            SERVER_ARCHIVE="axonml-server-${VERSION}-${NAME}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "$OUT/$CLI_ARCHIVE" axonml
            tar -C "target/${{ matrix.target }}/release" -czf "$OUT/$SERVER_ARCHIVE" axonml-server
          fi

          (cd "$OUT" && for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256" 2>/dev/null || shasum -a 256 "$f" > "$f.sha256"
          done)

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect all platform artifacts into one directory, compute the base64-
  # encoded SHA256 manifest that the SLSA generator signs. Single job ensures
  # provenance covers the entire release atomically.
  # ---------------------------------------------------------------------------
  collect:
    name: Collect hashes
    needs: build-binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Compute hash manifest
        id: hash
        run: |
          set -euo pipefail
          cd dist
          # Only hash the archives, not the .sha256 sidecar files
          HASHES=$(sha256sum *.tar.gz *.zip 2>/dev/null | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SLSA v1.0 Build L3 provenance.
  #
  # The slsa-github-generator reusable workflow runs in its own isolated
  # GitHub-managed environment. It:
  #   1. Receives only the hash manifest (base64-subjects) from the caller
  #   2. Generates provenance using GitHub's OIDC identity (no keys)
  #   3. Signs via Sigstore Fulcio + Rekor (transparency log)
  #   4. Uploads .intoto.jsonl to the GitHub Release
  #
  # This is L3 because the provenance generator is a reusable workflow
  # (runs in an isolated job, not inline steps the caller can tamper with)
  # on GitHub-hosted ephemeral runners.
  # ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: collect
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.collect.outputs.hashes }}
      upload-assets: true

  # ---------------------------------------------------------------------------
  # GitHub native artifact attestation (supplements SLSA provenance).
  # Creates Sigstore-backed attestations verifiable via `gh attestation verify`.
  # Each binary archive gets its own attestation.
  # ---------------------------------------------------------------------------
  attest:
    name: Artifact attestation
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Attest build provenance for each archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip'

  # ---------------------------------------------------------------------------
  # Source tarball + GitHub Release assembly. Runs after provenance + attest
  # so the release already has SLSA attestation when binaries are uploaded.
  # Uses gh CLI directly — no third-party release actions in the supply chain.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [collect, provenance, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Build source tarball
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          SRC="axonml-${VERSION}-source"
          git archive --format=tar.gz --prefix="axonml-${VERSION}/" HEAD > "dist/${SRC}.tar.gz"
          (cd dist && sha256sum "${SRC}.tar.gz" > "${SRC}.tar.gz.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          gh release create "$TAG" \
            --title "AxonML $TAG" \
            --generate-notes \
            $PRERELEASE \
            dist/*

          echo "## Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SLSA provenance (Level 3)" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "slsa-verifier verify-artifact <artifact> \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --provenance-path <intoto.jsonl> \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --source-uri github.com/AutomataNexus/AxonML" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GitHub attestation" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "gh attestation verify <artifact> -o AutomataNexus" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
