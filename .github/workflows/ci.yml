name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: we are NOT enabling `-D warnings` in RUSTDOCFLAGS yet. axonml-vision
  # has ~52 legitimate "unresolved link" warnings from tensor-shape notation in
  # doc comments (`[B, 1, H, W]` etc.) that rustdoc tries to resolve as
  # intra-doc links. Cleaning those up is a separate chore; in the meantime,
  # `cargo doc` without `-D warnings` still catches real breakage (missing
  # crates, renamed types, malformed markdown) without failing on style.

jobs:
  # Rust toolchain used by every job is pinned via rust-toolchain.toml at the
  # workspace root. `dtolnay/rust-toolchain@stable` honors that file — CI and
  # local devs always resolve to the same version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      # `cargo-nextest` is the de-facto Rust test runner (used by tokio,
      # rust-lang, ripgrep, etc.). vs `cargo test`:
      #   * --retries 2 — flaky tests (e.g. convergence tests using unseeded
      #     thread_rng() for weight init) pass if they succeed on any of the
      #     three attempts. A test fails CI only if it fails 3× in a row,
      #     correctly separating flakes from real regressions.
      #   * Parallelizes across tests, not within, which is faster on CI.
      #   * JUnit-compatible output.
      #
      # NOTE: the real fix for the convergence flake is seeded RNG in
      # `axonml_nn::init` (thread_rng → ChaCha8 seeded from test-scoped env).
      # That's a legit follow-up that touches 20+ call sites in axonml-nn and
      # axonml-tensor; nextest retries unblock CI while we plan that refactor.
      - uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --retries 2 -E 'not test(coco_bench)'
        timeout-minutes: 25

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # Catches broken intra-doc links, missing doc summaries, and any rustdoc
  # warning that would otherwise only surface on docs.rs after publishing.
  # Runs before publish.yml so we don't ship a release with broken rustdoc.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - name: Build docs (rustdoc warnings = errors)
        run: cargo doc --workspace --no-deps --document-private-items
