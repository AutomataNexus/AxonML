name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Check
        run: cargo check --workspace
      # The GPU backends are feature-gated, so a default-features check never
      # compiles them and they rot silently: a lint added in #5 broke the
      # Vulkan backend and nothing here noticed. check does not link, so this
      # needs no CUDA, Vulkan or NCCL installed on the runner.
      # Every CUDA kernel launch is unsafe because cudarc cannot see whether the
      # argument list matches the kernel. The PTX is in the repository and
      # declares every parameter's width, so this proves count and
      # pointer-vs-scalar for all 121 launches. Pure text, no GPU needed.
      - name: Verify kernel launches against PTX signatures
        run: python3 tools/check_launches.py
      - name: Check feature-gated backends
        run: cargo check --workspace --features axonml-core/vulkan,axonml-core/wgpu,axonml-distributed/nccl,axonml-core/cuda
      # axonml-core and axonml-tensor build without std (#12, #13). A host
      # target always has std available, so only a bare-metal target proves no
      # std-only crate (parking_lot, rayon, sysinfo, ...) slipped back in.
      - name: Check no_std (bare metal)
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo check -p axonml-core -p axonml-tensor --no-default-features --target thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --workspace --retries 2 -E 'not test(coco_bench)'
        timeout-minutes: 25

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Clippy feature-gated backends
        run: cargo clippy --workspace --features axonml-core/cuda,axonml-core/vulkan,axonml-core/wgpu,axonml-distributed/nccl -- -D warnings -D clippy::undocumented_unsafe_blocks

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - name: Build docs
        run: cargo doc --workspace --no-deps --document-private-items
