[package]
name = "nexus-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Autonomous AI agent framework for CI maintenance, knowledge management, and infrastructure automation — powered by local LLM inference via nexus-serve"

[workspace]

[dependencies]
# HTTP client for nexus-serve (OpenAI-compatible API)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"

# GUI ticker (glow/OpenGL backend — compatible with WSLg)
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[[bin]]
name = "nexus-ticker"
path = "src/ui/ticker.rs"

[[bin]]
name = "tech-ticker"
path = "src/ui/tech_ticker.rs"
