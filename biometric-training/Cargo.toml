[package]
name = "biometric-training"
version = "0.1.0"
edition = "2024"
description = "Train the Aegis biometric suite (Mnemosyne, Argus, Ariadne, Echo, Themis) end-to-end on real datasets"
rust-version = "1.85"

# Standalone workspace — decouples from /opt/AxonML root workspace so we can
# iterate on biometric training code without rebuilding the entire framework.
[workspace]

[dependencies]
axonml-core      = { path = "/opt/AxonML/crates/axonml-core" }
axonml-tensor    = { path = "/opt/AxonML/crates/axonml-tensor" }
axonml-autograd  = { path = "/opt/AxonML/crates/axonml-autograd" }
axonml-nn        = { path = "/opt/AxonML/crates/axonml-nn" }
axonml-optim     = { path = "/opt/AxonML/crates/axonml-optim" }
axonml-vision    = { path = "/opt/AxonML/crates/axonml-vision" }
axonml-serialize = { path = "/opt/AxonML/crates/axonml-serialize" }
axonml           = { path = "/opt/AxonML/crates/axonml" }

rand = "0.8"

[features]
default = []
cuda = [
    "axonml-core/cuda",
    "axonml-tensor/cuda",
    "axonml-autograd/cuda",
    "axonml-nn/cuda",
]

# =============================================================================
# Training binaries — one per biometric modality + fusion
# =============================================================================

[[bin]]
name = "train_mnemosyne"
path = "src/bin/train_mnemosyne.rs"

[[bin]]
name = "train_argus"
path = "src/bin/train_argus.rs"

[[bin]]
name = "train_ariadne"
path = "src/bin/train_ariadne.rs"
