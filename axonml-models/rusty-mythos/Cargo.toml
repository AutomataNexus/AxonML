[package]
name = "rusty-mythos"
version = "0.1.0"
edition = "2021"
authors = ["Andrew Jewell Sr. <andrew.jewellsr@automatanexus.com>"]
description = "RustyMythos — Recurrent-depth transformer with MoE routing and stable latent-space reasoning"

[[bin]]
name = "train_rusty_mythos"
path = "src/train.rs"

[[bin]]
name = "export_rusty_mythos"
path = "src/export.rs"

[[bin]]
name = "profile_rusty_mythos"
path = "src/profile_all.rs"

[dependencies]
nexusfoundry-profiler = { path = "/opt/NexusFoundry/crates/nexusfoundry-profiler" }
axonml = { path = "../../crates/axonml" }
axonml-tensor = { path = "../../crates/axonml-tensor" }
axonml-autograd = { path = "../../crates/axonml-autograd" }
axonml-nn = { path = "../../crates/axonml-nn" }
axonml-optim = { path = "../../crates/axonml-optim" }
axonml-serialize = { path = "../../crates/axonml-serialize" }
axonml-onnx = { path = "../../crates/axonml-onnx" }
axonml-data = { path = "../../crates/axonml-data" }
serde_json = "1.0"
