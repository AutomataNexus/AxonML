# =============================================================================
# Axonml Fusion - Kernel Fusion for Performance Optimization
# =============================================================================
#
# Provides kernel fusion support for combining multiple operations into
# single optimized kernels, reducing memory bandwidth and improving throughput.
#
# @version 0.1.0
# @author AutomataNexus Development Team
# =============================================================================

[package]
name = "axonml-fusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Kernel fusion optimization for the Axonml ML framework"
readme = "README.md"
keywords = ["kernel-fusion", "optimization", "machine-learning", "performance"]
categories = ["science", "mathematics"]

[features]
default = ["std"]
std = []

[dependencies]
# Internal crates
axonml-core.workspace = true
axonml-tensor.workspace = true

# Error handling
thiserror = { workspace = true }

# Parallel processing
rayon = { workspace = true }

# BLAS-accelerated matrix operations
matrixmultiply.workspace = true

[dev-dependencies]
approx = { workspace = true }

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
