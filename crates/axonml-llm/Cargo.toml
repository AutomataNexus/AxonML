# =============================================================================
# Axonml LLM - Large Language Model Architectures
# =============================================================================
#
# Provides implementations of transformer-based language models including
# BERT, GPT-2, and building blocks for custom LLM architectures.
#
# @version 0.1.0
# @author AutomataNexus Development Team
# @license MIT OR Apache-2.0
# =============================================================================

[package]
name = "axonml-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["llm", "bert", "gpt", "transformer", "machine-learning"]
categories = ["science", "algorithms"]
description = "Large Language Model architectures for the Axonml ML framework"
readme = "README.md"

[dependencies]
# Internal crates
axonml-core = { workspace = true }
axonml-tensor = { workspace = true }
axonml-autograd = { workspace = true }
axonml-nn = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Randomness
rand = { workspace = true }

# Hub functionality
dirs = { workspace = true }
reqwest = { workspace = true }

# Model loading
safetensors = "0.3"
byteorder = "1.5"
indicatif = { workspace = true }
half = "2.3"

[dev-dependencies]
approx = { workspace = true }
axonml-optim = { workspace = true }
axonml = { path = "../axonml" }

[features]
default = []
pretrained = []  # Load pretrained weights

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
