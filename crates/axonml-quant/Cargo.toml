# =============================================================================
# Axonml Quant - Model Quantization for ML Inference
# =============================================================================
#
# Provides quantization support for reducing model size and improving
# inference performance. Supports INT8, INT4, and other quantization formats.
#
# @version 0.1.0
# @author AutomataNexus Development Team
# =============================================================================

[package]
name = "axonml-quant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Model quantization for the Axonml ML framework"
readme = "README.md"
keywords = ["quantization", "machine-learning", "deep-learning", "int8", "int4"]
categories = ["science", "mathematics"]

[features]
default = ["std"]
std = []

[dependencies]
# Internal crates
axonml-core.workspace = true
axonml-tensor.workspace = true
axonml-autograd.workspace = true
axonml-nn.workspace = true

# Error handling
thiserror = { workspace = true }

# Byte manipulation
bytemuck = { workspace = true }

# Half precision
half = { workspace = true }

# Parallel processing
rayon = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
