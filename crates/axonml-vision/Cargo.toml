[package]
name = "axonml-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Computer vision utilities for the Axonml ML framework"
readme = "README.md"

[dependencies]
axonml-core.workspace = true
axonml-tensor.workspace = true
axonml-data.workspace = true
axonml-nn.workspace = true
axonml-autograd.workspace = true
axonml-optim.workspace = true
image = "0.25"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1.5"
flate2 = "1.0"
dirs.workspace = true

[features]
default = ["download"]
download = ["reqwest"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking"]
optional = true
