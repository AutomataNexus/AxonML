[package]
name = "axonml-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Computer vision utilities for the Axonml ML framework"
readme = "README.md"

[dependencies]
axonml-core.workspace = true
axonml-tensor.workspace = true
axonml-data.workspace = true
axonml-nn.workspace = true
axonml-autograd.workspace = true
axonml-optim.workspace = true
image = "0.25"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1.5"
flate2 = "1.0"
dirs.workspace = true

[features]
default = ["download"]
download = ["reqwest"]
cuda = ["axonml-tensor/cuda", "axonml-nn/cuda", "axonml-autograd/cuda", "axonml-core/cuda"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking"]
optional = true

[dev-dependencies]
axonml = { path = "../axonml" }
axonml-serialize = { path = "../axonml-serialize" }
rayon.workspace = true

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
