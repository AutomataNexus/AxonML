[package]
name = "axonml-nn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Neural network modules for Axonml ML framework"
readme = "README.md"

[features]
default = []
cuda = ["axonml-tensor/cuda", "axonml-core/cuda"]
cudnn = ["cuda", "axonml-core/cudnn", "axonml-tensor/cudnn"]

[dependencies]
axonml-core.workspace = true
axonml-tensor.workspace = true
axonml-autograd.workspace = true
parking_lot.workspace = true
rand = "0.8"
rayon.workspace = true
rustfft = "6.2"

[dev-dependencies]
axonml-optim = { path = "../axonml-optim" }

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
