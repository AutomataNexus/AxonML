# =============================================================================
# Axonml Tensor - N-Dimensional Array Operations
# =============================================================================
#
# Provides the core Tensor type and all tensor operations including creation,
# arithmetic, broadcasting, indexing, and linear algebra operations.
#
# @version 0.1.0
# @author AutomataNexus Development Team
# =============================================================================

[package]
name = "axonml-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "N-dimensional tensor operations for the Axonml ML framework"
readme = "README.md"
keywords = ["tensor", "ndarray", "machine-learning", "linear-algebra"]
categories = ["science", "mathematics"]

[features]
default = ["std"]
std = ["axonml-core/std"]
cuda = ["axonml-core/cuda", "dep:cudarc"]
cudnn = ["cuda", "axonml-core/cudnn"]

[dependencies]
axonml-core.workspace = true
num-traits.workspace = true
rand.workspace = true
rand_distr.workspace = true
smallvec.workspace = true
half.workspace = true
cudarc = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true

# CUDA-dependent microbenches — only build when the `cuda` feature is on.
# Keeps `cargo test --workspace` (default features) green on non-CUDA hosts.
[[example]]
name = "bench_silu_backward"
required-features = ["cuda"]

[[example]]
name = "bench_attention_bwd"
required-features = ["cuda"]

[[example]]
name = "bench_contiguous_gpu"
required-features = ["cuda"]

[[example]]
name = "bench_reduce_bias"
required-features = ["cuda"]

[[example]]
name = "bench_matmul_bwd"
required-features = ["cuda"]

[[example]]
name = "bench_linear_bwd"
required-features = ["cuda"]

[[example]]
name = "bench_rmsnorm_bwd"
required-features = ["cuda"]

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
