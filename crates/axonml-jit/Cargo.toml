[package]
name = "axonml-jit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "JIT compilation for Axonml tensor operations"
readme = "README.md"

[dependencies]
axonml-core = { workspace = true }
axonml-tensor = { workspace = true }

# Cranelift JIT backend
cranelift = "0.111"
cranelift-jit = "0.111"
cranelift-module = "0.111"
cranelift-native = "0.111"
target-lexicon = "0.12"

# Utilities
parking_lot = "0.12"
rustc-hash = "2.0"

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
