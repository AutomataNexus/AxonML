[package]
name = "axonml-serialize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Model serialization for Axonml ML framework"
readme = "README.md"
keywords = ["machine-learning", "serialization", "deep-learning"]
categories = ["science", "data-structures"]

[dependencies]
axonml-core.workspace = true
axonml-tensor.workspace = true
axonml-nn.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Optional formats
safetensors = { version = "0.3", optional = true }

[features]
default = []
safetensors = ["dep:safetensors"]

[dev-dependencies]
tempfile = "3.0"

# Controls how docs.rs builds this crate when a new version is published.
# * default-target + targets = build only on Linux x86_64; GPU backends
#   (cuda/vulkan/metal/wgpu) require system SDKs that docs.rs doesn't have,
#   so we don't try to cross-build multiple platforms.
# * rustdoc-args sets the `docsrs` cfg so the crate can gate platform- or
#   feature-specific code with `#[cfg(docsrs)]` or `#[cfg_attr(docsrs, ...)]`
#   when docs.rs compiles it.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
